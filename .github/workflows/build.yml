name: Build Android APK

on:
  push:
    branches:
      - 'main'
      - 'fix/*'
      - 'feature/*'
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - 'app/src/main/assets/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'version.json'
      - '.github/workflows/build.yml'
      - 'desktop/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        env:
          FOKK_AI_KEY: ${{ secrets.FOKK_AI_KEY }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Log Build Failure
        if: failure()
        run: |
          echo "### Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Post Failure Comment to Commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERRS=$(grep -E '(^e: |error:|FAILED)' build.log | head -n 40 || true)
          TAIL=$(tail -n 60 build.log)
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(echo -e '### Build Failure\n```\nCompiler Errors:\n'"$ERRS"'\n\nLog Tail:\n'"$TAIL"'\n```')" || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdShield-App
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          TAG="v$VERSION"
          IS_MAIN=false
          EXTRA_FLAG="--prerelease"
          if [ "${{ github.ref_name }}" = "main" ]; then
            IS_MAIN=true
            EXTRA_FLAG="--latest"
          fi
          echo "Deploying release $TAG (branch=${{ github.ref_name }}, is_main=$IS_MAIN)"

          deploy_release() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists — uploading updated APK and syncing metadata..."
              gh release upload "$TAG" app/build/outputs/apk/debug/*.apk --clobber
              if [ "$IS_MAIN" = "true" ]; then
                gh release edit "$TAG" \
                  --title "Fokk Shield Android $TAG" \
                  --notes-file version.json \
                  --prerelease=false \
                  --latest
              else
                gh release edit "$TAG" \
                  --title "Fokk Shield Android $TAG" \
                  --notes-file version.json
              fi
            else
              echo "Creating new release $TAG..."
              gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
                --title "Fokk Shield Android $TAG" \
                --notes-file version.json \
                $EXTRA_FLAG
            fi
          }

          # Retry up to 3 times on transient GitHub API 502/503 blips
          for attempt in 1 2 3; do
            if deploy_release; then
              echo "Release $TAG deployed successfully on attempt $attempt."
              exit 0
            fi
            echo "Release attempt $attempt failed — retrying in 8s..."
            sleep 8
          done
          echo "ERROR: Failed to deploy release $TAG after 3 attempts."
          exit 1
