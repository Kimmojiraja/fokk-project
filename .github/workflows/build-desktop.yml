name: Build & Release Desktop Browser (Linux, Windows, macOS)

on:
  push:
    branches:
      - 'main'
      - 'feature/*'
      - 'fix/*'
    paths:
      - 'desktop/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/build-desktop.yml'
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux (.deb & .AppImage)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: desktop
        run: npm install --no-audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_GET_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux Packages
        working-directory: desktop
        run: npx electron-builder --linux deb AppImage --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fokk-Browser-Linux
          path: |
            desktop/dist/*.deb
            desktop/dist/*.AppImage
          retention-days: 14

      - name: Publish Linux to Desktop Release
        if: success()
        continue-on-error: true
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="desktop-v$VERSION"
          echo "Targeting release tag: $TAG"
          NOTES="Fokk Browser Desktop v$VERSION multi-platform release with uBlock Origin adblocker, browsing history, downloads manager, custom profile, shortcut tiles, and cohesive themes."
          gh release view "$TAG" || gh release create "$TAG" \
            --title "Fokk Desktop v$VERSION (Linux, Windows, macOS)" \
            --notes "$NOTES" \
            --prerelease=false || true

          gh release upload "$TAG" dist/*.deb dist/*.AppImage --clobber || true

  build-windows:
    name: Build Windows (Zip & Portable)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: desktop
        run: npm install --no-audit

      - name: Build Windows Packages
        working-directory: desktop
        run: npx electron-builder --win zip portable --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fokk-Browser-Windows
          path: |
            desktop/dist/*-win.zip
            desktop/dist/*.exe
          retention-days: 14

      - name: Publish Windows to Desktop Release
        if: success()
        continue-on-error: true
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="desktop-v$VERSION"
          echo "Targeting release tag: $TAG"
          gh release view "$TAG" || gh release create "$TAG" \
            --title "Fokk Desktop v$VERSION (Linux, Windows, macOS)" \
            --notes "Fokk Browser Desktop v$VERSION multi-platform release." \
            --prerelease=false || true

          gh release upload "$TAG" dist/*-win.zip dist/*.exe --clobber || true

  build-macos:
    name: Build macOS (Zip)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: desktop
        run: npm install --no-audit

      - name: Build macOS Package
        working-directory: desktop
        run: npx electron-builder --mac zip --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fokk-Browser-macOS
          path: desktop/dist/*-mac.zip
          retention-days: 14

      - name: Publish macOS to Desktop Release
        if: success()
        continue-on-error: true
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="desktop-v$VERSION"
          echo "Targeting release tag: $TAG"
          gh release view "$TAG" || gh release create "$TAG" \
            --title "Fokk Desktop v$VERSION (Linux, Windows, macOS)" \
            --notes "Fokk Browser Desktop v$VERSION multi-platform release." \
            --prerelease=false || true

          gh release upload "$TAG" dist/*-mac.zip --clobber || true
