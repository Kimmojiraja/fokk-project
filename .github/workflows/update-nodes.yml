name: Fokk Mesh Sentinel — Node Health & Manifest Update

# Runs every 6 hours to verify relays, test 2-hop chaining, sign, and publish live manifest.
on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  node-health-check:
    name: Scan, Verify, Sign & Publish Live Fokk Mesh Manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cryptography for Ed25519 signing
        run: python3 -m pip install --quiet cryptography

      - name: Run Fokk Sentinel Node Scanner
        id: scan
        env:
          FOKK_MESH_ED25519_PRIVKEY: ${{ secrets.FOKK_MESH_ED25519_PRIVKEY }}
        run: |
          python3 scripts/sentinel_node_scanner.py

      - name: Publish live manifest to mesh-manifest branch (bypasses main PR lock)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp nodes_manifest.json /tmp/nodes_manifest.json
          cp nodes.json /tmp/nodes.json

          if git ls-remote --exit-code --heads origin mesh-manifest >/dev/null 2>&1; then
            git fetch origin mesh-manifest
            git checkout -B mesh-manifest origin/mesh-manifest
          else
            git checkout --orphan mesh-manifest
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp /tmp/nodes_manifest.json nodes_manifest.json
          cp /tmp/nodes.json nodes.json
          git add nodes_manifest.json nodes.json

          if ! git diff --staged --quiet; then
            git commit -m "chore(sentinel): publish verified Fokk Mesh manifest [skip ci]"
            git push origin mesh-manifest
            echo "Published live manifest to mesh-manifest branch."
          else
            echo "mesh-manifest branch already up to date."
          fi

          # Return to triggering branch
          git checkout -f ${{ github.ref_name }}
          cp /tmp/nodes_manifest.json nodes_manifest.json
          cp /tmp/nodes.json nodes.json

      - name: Publish live manifest asset to mesh-manifest-live CDN release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create mesh-manifest-live nodes_manifest.json nodes.json \
            --title "Fokk Mesh Live Verified Manifest" \
            --notes "Automated 6-hour Sentinel verified Fokk Mesh relay manifest." \
            --prerelease || \
          gh release upload mesh-manifest-live nodes_manifest.json nodes.json --clobber

      - name: Verify minimum healthy relay count
        run: |
          COUNT=$(python3 -c "import json; m=json.load(open('nodes_manifest.json')); print(len(m.get('nodes', [])))")
          echo "Verified Fokk Mesh relay count: $COUNT"
          if [ "$COUNT" -lt 3 ]; then
            echo "CRITICAL: Only $COUNT relays verified. Minimum healthy threshold is 3."
            exit 1
          fi
