name: Fokk Mesh Sentinel — Node Health & Manifest Update

# Runs every 6 hours to catch dead nodes fast and keep the manifest fresh.
on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  node-health-check:
    name: Scan, Verify & Update Node Manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fokk Sentinel Node Scanner
        id: scan
        run: |
          python3 scripts/sentinel_node_scanner.py
        # Script writes to $GITHUB_STEP_SUMMARY automatically

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodes_manifest.json nodes.json
          if ! git diff --staged --quiet; then
            REMOVED=$(git diff --staged nodes_manifest.json | grep '^-.*"host"' | wc -l || echo 0)
            ADDED=$(git diff --staged nodes_manifest.json | grep '^+.*"host"' | wc -l || echo 0)
            git commit -m "chore(sentinel): update verified node manifest [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "Push skipped or branch protected"
            echo "Manifest update process completed."
          else
            echo "All nodes healthy - no manifest changes needed."
          fi

      - name: Verify node count
        run: |
          COUNT=$(python3 -c "import json; m=json.load(open('nodes_manifest.json')); print(len(m.get('nodes', [])))")
          echo "Verified node count: $COUNT"
          if [ "$COUNT" -lt 5 ]; then
            echo "CRITICAL: Only $COUNT nodes verified. Minimum is 5."
            exit 1
          fi
