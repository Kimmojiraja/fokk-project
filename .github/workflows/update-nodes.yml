name: Fokk Sentinel Node Scanner

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 02:00 UTC
  workflow_dispatch:

jobs:
  update-nodes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySocks

      - name: Scan & Verify Privacy Nodes
        run: |
          python3 scripts/sentinel_node_scanner.py

      - name: Commit & Push Updated Nodes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodes.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(sentinel): auto-update verified privacy nodes [skip ci]"
            git push
          else
            echo "No node changes detected; all nodes healthy."
          fi
