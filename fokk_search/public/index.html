<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fokk Search</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="home-view" data-theme="dark">

    <!-- App Header (Sticky) -->
    <header class="app-header">
        <a href="/" class="brand-group" id="headerBrand">
            <img src="/icon.png" alt="Fokk Logo" class="brand-icon">
            <span class="brand-title">Fokk Search</span>
        </a>

        <!-- Results Search Bar (Visible only in results mode) -->
        <div class="search-wrapper" id="resultsSearchWrap">
            <form id="resultsSearchForm" class="search-box">
                <input type="text" id="resultsSearchInput" class="search-input" placeholder="Search the web freely..." autocomplete="off" spellcheck="false">
                <button type="button" class="clear-btn hidden" id="resultsClearBtn" title="Clear">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <button type="submit" class="search-btn" title="Search">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </form>
            <div id="resultsSuggestions" class="suggestions-dropdown"></div>
        </div>

        <!-- Theme Toggle Button -->
        <button id="themeToggleBtn" class="btn-icon" title="Toggle Theme" aria-label="Toggle Theme">
            <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </header>

    <!-- Hero Section (Visible in Home Mode) -->
    <main class="hero-section" id="heroSection">
        <div class="brand-hero-wrap">
            <img src="/icon.png" alt="Fokk Logo" class="hero-logo-img">
            <h1 class="brand-title hero-brand-title">Fokk Search</h1>
        </div>
        <p class="hero-tagline">Fast, independent, private search engine.</p>

        <div class="search-wrapper">
            <form id="heroSearchForm" class="search-box hero-search-box">
                <input type="text" id="heroSearchInput" class="search-input" placeholder="Search the web freely..." autocomplete="off" spellcheck="false" autofocus>
                <span class="shortcut-hint">/</span>
                <button type="button" class="clear-btn hidden" id="heroClearBtn" title="Clear">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <button type="submit" class="search-btn" title="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </form>
            <div id="heroSuggestions" class="suggestions-dropdown"></div>
        </div>

        <div class="privacy-pills-row">
            <div class="privacy-pill">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>Zero Tracking</span>
            </div>
            <div class="privacy-pill">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                <span>Multi-Source Intelligence</span>
            </div>
            <div class="privacy-pill">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
                <span>Zero Commercial Ads</span>
            </div>
        </div>
    </main>

    <!-- Categories / Tabs Navigation (Results Mode) -->
    <nav class="nav-categories" id="navCategories">
        <!-- 1. All (Globe) -->
        <button class="tab-btn active" data-category="all">
            <svg class="tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span>All</span>
        </button>
        <!-- 2. Images (Gallery) -->
        <button class="tab-btn" data-category="images">
            <svg class="tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="3" ry="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>Images</span>
        </button>
        <!-- 3. Videos (Play Reel) -->
        <button class="tab-btn" data-category="videos">
            <svg class="tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="4" width="20" height="16" rx="3" ry="3"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/></svg>
            <span>Videos</span>
        </button>
        <!-- 4. News (Newspaper) -->
        <button class="tab-btn" data-category="news">
            <svg class="tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
            <span>News</span>
        </button>
        <!-- 5. Discussions (Community Forums) -->
        <button class="tab-btn" data-category="discussions">
            <svg class="tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/></svg>
            <span>Discussions</span>
        </button>
    </nav>

    <!-- Search Metrics -->
    <div class="search-metrics" id="searchMetrics"></div>

    <!-- Results Content Layout -->
    <main class="results-layout" id="resultsLayout">
        <!-- Main Column -->
        <div class="results-col-main" id="resultsMainCol"></div>

        <!-- Sidebar Column (Knowledge Panel) -->
        <aside class="results-col-side" id="resultsSideCol"></aside>
    </main>

    <!-- Image Lightbox Modal -->
    <div class="modal-overlay" id="imageModal">
        <div class="modal-content">
            <button class="modal-close-btn" id="modalCloseBtn" title="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="modal-img-wrap">
                <img id="modalImg" src="" alt="Preview">
            </div>
            <div class="modal-footer">
                <div>
                    <h3 id="modalTitle" class="modal-title-text"></h3>
                    <p id="modalDomain" class="modal-domain-text"></p>
                </div>
                <div style="display:flex; gap:10px;">
                    <a id="modalDownloadBtn" href="#" target="_blank" download class="privacy-pill" style="text-decoration:none; color: var(--text-primary); cursor:pointer;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        <span>Direct Image</span>
                    </a>
                    <a id="modalVisitBtn" href="#" target="_blank" rel="noopener noreferrer" class="privacy-pill" style="text-decoration:none; color: var(--accent); border-color: var(--accent);">
                        <span>Visit Page</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="/search.js"></script>
</body>
</html>
