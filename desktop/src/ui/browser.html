<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fokk Browser</title>
    <link rel="stylesheet" href="browser.css">
</head>
<body>
    <!-- 1. Window Titlebar & Tab Strip -->
    <div class="titlebar" id="titlebar">
        <div class="app-brand-drag">
            <div class="app-brand-badge">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z" fill="#00E5FF"/>
                    <path d="M10 12.5l-2-2-1.41 1.41L10 15.33l6-6-1.41-1.41z" fill="#0B0F19"/>
                </svg>
            </div>
            <span class="app-title">FOKK</span>
        </div>
        <div class="tab-strip" id="tabStrip">
            <!-- Tabs dynamically injected -->
            <button class="new-tab-btn" id="btnNewTab" title="New Tab (Ctrl+T)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
        </div>
        <div class="window-controls">
            <button class="win-btn" id="btnMin" title="Minimize">─</button>
            <button class="win-btn" id="btnMax" title="Maximize">□</button>
            <button class="win-btn win-close" id="btnClose" title="Close">✕</button>
        </div>
    </div>

    <!-- 2. Omnibox & Navigation Toolbar -->
    <div class="toolbar" id="toolbar">
        <div class="nav-controls">
            <button class="nav-btn" id="btnBack" title="Back" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button class="nav-btn" id="btnForward" title="Forward" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <button class="nav-btn" id="btnReload" title="Reload">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/></svg>
            </button>
            <button class="nav-btn" id="btnHome" title="Fokk Home">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </button>
        </div>

        <!-- Address Bar / Search Omnibox -->
        <div class="omnibox-wrapper">
            <div class="shield-badge" id="shieldBadge" title="Fokk Shield Active — Zero Ads & Trackers">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00E5FF" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                <span class="shield-count" id="shieldCountText">0</span>
            </div>

            <!-- Omnibox Search Engine Selector -->
            <div class="omnibox-engine-selector" id="omniboxEngineSelector" title="Choose Search Engine">
                <span id="omniboxEngineIcon" class="omnibox-engine-icon">
                    <svg width="15" height="15" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.04h3.88c2.27-2.09 3.66-5.17 3.66-9.14z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.04c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.13C3.27 21.43 7.35 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.28c-.24-.72-.38-1.49-.38-2.28s.14-1.56.38-2.28V6.59H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.41l4.03-3.13z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.27 2.57 1.25 6.59l4.03 3.13c.95-2.83 3.6-4.97 6.72-4.97z"/>
                    </svg>
                </span>
                <svg class="engine-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>

                <div id="omniboxEngineDropdown" class="omnibox-engine-dropdown hidden">
                    <div class="engine-item selected" data-engine="google">Google</div>
                    <div class="engine-item" data-engine="brave">Brave Search</div>
                    <div class="engine-item" data-engine="duckduckgo">DuckDuckGo</div>
                    <div class="engine-item" data-engine="bing">Bing</div>
                </div>
            </div>

            <input type="text" id="urlInput" class="omnibox-input" placeholder="Search with Google or enter address" autocomplete="off" spellcheck="false">
        </div>

        <div class="extra-actions">
            <button class="nav-btn" id="btnVisuals" title="4K Visuals & Wallpapers">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </button>
            <button class="nav-btn" id="btnMenu" title="Menu">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
        </div>
    </div>

    <!-- 3-Dots Desktop Browser Menu Dropdown -->
    <div id="desktopBrowserMenu" class="browser-menu-dropdown hidden">
        <div class="menu-item" id="menuNewTab">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>New Tab</span>
            <span class="menu-shortcut">Ctrl+T</span>
        </div>
        <div class="menu-item" id="menuVisuals">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            <span>Visuals & Wallpapers</span>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="menuBookmarks">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
            <span>Bookmarks</span>
            <span class="menu-shortcut">Ctrl+D</span>
        </div>
        <div class="menu-item" id="menuHistory">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>History</span>
            <span class="menu-shortcut">Ctrl+H</span>
        </div>
        <div class="menu-item" id="menuDownloads">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Downloads</span>
            <span class="menu-shortcut">Ctrl+J</span>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item-row">
            <span>Zoom</span>
            <div class="zoom-controls">
                <button class="zoom-btn" id="btnZoomOut">−</button>
                <span class="zoom-level" id="zoomLevelText">100%</span>
                <button class="zoom-btn" id="btnZoomIn">+</button>
            </div>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="menuToggleShield">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00E5FF" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            <span>Fokk Shield: Active</span>
        </div>
        <div class="menu-item" id="menuClearData">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            <span>Clear Browsing Data</span>
        </div>
    </div>

    <!-- 3. Webview Tab Views Container -->
    <div class="views-container" id="viewsContainer"></div>

    <script src="browser.js"></script>
</body>
</html>
